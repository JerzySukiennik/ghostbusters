<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<title>Janine clip bake</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Bakes Janine's seated desk clips (UAL sitting and phone layers retargeted by the game's Animator, IK hands on desk, keyboard and phone, handset and morph tracks).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Animator } from './src/game/anim.js';

const FPS = 30, S = 0.955;
const DESK = { top: 0.30, front: 0.27, kb: [0.08, 0.318, 0.46], mon: [0.42, 0.62, 0.80], monYaw: 0.48 };
const gltf = await new GLTFLoader().loadAsync('blender/people/work/janine_base.glb');
const root = gltf.scene;
const rig = root.getObjectByName('JurekRig');
rig.scale.set(1, 1, 1);
let body = null;
root.traverse((o) => { if (o.isSkinnedMesh && o.name === 'JanineBody') body = o; });
root.updateMatrixWorld(true);
body.skeleton.calculateInverses();
body.bind(body.skeleton, body.matrixWorld);
const bones = new Map();
root.traverse((o) => { if (o.isBone) bones.set(o.name, o); });
const rest = new Map(), rq = new Map(), rp = new Map();
for (const [n, b] of bones) { rest.set(n, { p: b.position.clone(), q: b.quaternion.clone(), s: b.scale.clone() }); rq.set(n, b.getWorldQuaternion(new THREE.Quaternion())); rp.set(n, b.getWorldPosition(new THREE.Vector3())); }
const anim = await Animator.create({ root, bones, rest, restWorldQ: rq, restWorldP: rp });
const mixer = new THREE.AnimationMixer(root);
const B = (n) => bones.get(n);
const NAMES = [...bones.keys()].filter((n) => !n.startsWith('Hair_'));
const Q1 = new THREE.Quaternion(), Q2 = new THREE.Quaternion();
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
const pos = (b) => b.getWorldPosition(new THREE.Vector3());
const v3 = (a) => new THREE.Vector3(a[0], a[1], a[2]).divideScalar(S);
const ease = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const axis = (ax, a) => new THREE.Quaternion().setFromAxisAngle(ax, a);

function resetRest() { for (const [n, b] of bones) { const r = rest.get(n); b.position.copy(r.p); b.quaternion.copy(r.q); b.scale.copy(r.s); } }
function rotWorld(b, dq) {
  b.getWorldQuaternion(Q1); b.parent.getWorldQuaternion(Q2);
  b.quaternion.copy(Q2.invert().multiply(dq.clone().multiply(Q1))).normalize();
  b.updateMatrixWorld(true);
}
function aim(b, child, dir) {
  const p = pos(b), c = pos(child);
  rotWorld(b, new THREE.Quaternion().setFromUnitVectors(c.sub(p).normalize(), dir.clone().normalize()));
}
function ik(side, target, pole) {
  const up = B(side + 'Arm'), lo = B(side + 'ForeArm'), hd = B(side + 'Hand');
  const Sh = pos(up), E = pos(lo), H = pos(hd);
  const a = E.distanceTo(Sh), b = H.distanceTo(E);
  const tv = target.clone().sub(Sh); const dd = Math.min(Math.max(tv.length(), 0.05), (a + b) * 0.999);
  const u = tv.normalize();
  const w = pole.clone().sub(u.clone().multiplyScalar(pole.dot(u))).normalize();
  const ca = (a * a + dd * dd - b * b) / (2 * a * dd), sa = Math.sqrt(Math.max(0, 1 - ca * ca));
  const Ep = Sh.clone().add(u.clone().multiplyScalar(a * ca)).add(w.clone().multiplyScalar(a * sa));
  aim(up, lo, Ep.clone().sub(Sh));
  aim(lo, hd, Sh.clone().add(u.clone().multiplyScalar(dd)).sub(pos(lo)));
}
function look(pitch, yaw = 0) {
  rotWorld(B('Neck'), axis(Y, yaw * 0.4).multiply(axis(X, -pitch * 0.4)));
  rotWorld(B('Head'), axis(Y, yaw * 0.6).multiply(axis(X, -pitch * 0.6)));
}
const jaw = (a) => rotWorld(B('Jaw'), axis(X, a));
const twist = (a, lean = 0) => { rotWorld(B('Spine1'), axis(Y, a * 0.4).multiply(axis(X, lean * 0.5))); rotWorld(B('Spine2'), axis(Y, a * 0.6).multiply(axis(X, lean * 0.5))); };

function playSrc(lo, up) {
  mixer.stopAllAction();
  const acts = [mixer.clipAction(anim.clips.get(lo).lo), mixer.clipAction(anim.clips.get(up).up)];
  for (const a of acts) { a.reset(); a.setLoop(THREE.LoopRepeat, Infinity); a.setEffectiveWeight(1); a.play(); }
  return acts;
}
let HIPS_OFF = new THREE.Vector3();
function base(lo, up, t) {
  resetRest();
  const acts = playSrc(lo, up);
  acts[0].time = t % anim.clips.get(lo).dur; acts[1].time = t % anim.clips.get(up).dur;
  mixer.update(0);
  B('Hips').position.add(HIPS_OFF);
  root.updateMatrixWorld(true);
}
function capture() { const m = new Map(); for (const n of NAMES) m.set(n, B(n).quaternion.clone()); return { q: m, hp: B('Hips').position.clone() }; }
function apply(p) { for (const n of NAMES) B(n).quaternion.copy(p.q.get(n)); B('Hips').position.copy(p.hp); root.updateMatrixWorld(true); }
function blendTo(p, w) { for (const n of NAMES) B(n).quaternion.slerp(p.q.get(n), w); B('Hips').position.lerp(p.hp, w); root.updateMatrixWorld(true); }

base('Sitting_Idle_Loop', 'Sitting_Idle_Loop', 0);
const bodyBones = body.skeleton.bones.map((b) => b.name);
const wi = body.geometry.attributes.skinIndex, ww = body.geometry.attributes.skinWeight, PV = new THREE.Vector3();
let floor = Infinity;
const FEET = new Set(['LeftFoot', 'RightFoot', 'LeftToeBase', 'RightToeBase'].map((n) => bodyBones.indexOf(n)));
for (let i = 0; i < wi.count; i++) {
  let w = 0; for (let k = 0; k < 4; k++) if (FEET.has(wi.getComponent(i, k))) w += ww.getComponent(i, k);
  if (w > 0.5) { body.getVertexPosition(i, PV); PV.applyMatrix4(body.matrixWorld); floor = Math.min(floor, PV.y); }
}
const kneeY = (pos(B('LeftLeg')).y + pos(B('RightLeg')).y) / 2;
const contact = Math.min(kneeY - 0.06, pos(B('Hips')).y - 0.10);
const hip0 = pos(B('Hips'));
HIPS_OFF.set(-hip0.x, -contact, -0.05 / S - hip0.z);
base('Sitting_Idle_Loop', 'Sitting_Idle_Loop', 0);
const seatHeight = (contact - floor) * S;
const hipsY = pos(B('Hips')).y * S;

const eyeL = rp.get('LeftEye'), eyeR = rp.get('RightEye');
const restHead = (() => { resetRest(); root.updateMatrixWorld(true); const m = new THREE.Matrix4().copy(B('Head').matrixWorld).invert(); return m; })();
const EAR = { Left: new THREE.Vector3(eyeL.x + 0.040, eyeL.y - 0.022, eyeL.z - 0.085).applyMatrix4(restHead), Right: new THREE.Vector3(eyeR.x - 0.040, eyeR.y - 0.022, eyeR.z - 0.085).applyMatrix4(restHead) };
const MOUTH = new THREE.Vector3(0, eyeL.y - 0.078, eyeL.z + 0.004).applyMatrix4(restHead);
const headPt = (l) => l.clone().applyMatrix4(B('Head').matrixWorld);

base('Sitting_Idle_Loop', 'Idle_TalkingPhone_Loop', 0);
const PHONE_HAND = pos(B('LeftHand')).distanceTo(pos(B('Head'))) < pos(B('RightHand')).distanceTo(pos(B('Head'))) ? 'Left' : 'Right';
const FREE = PHONE_HAND === 'Left' ? 'Right' : 'Left';
const sgP = PHONE_HAND === 'Left' ? 1 : -1;
const PHONE = { p: [sgP * 0.40, DESK.top, 0.50], yaw: Math.PI + sgP * 0.55 };
const HS_LOCAL = new THREE.Vector3(0, 0.105, -0.055);
const phoneQ = axis(Y, PHONE.yaw);
const cradleP = HS_LOCAL.clone().applyQuaternion(phoneQ).add(new THREE.Vector3(...PHONE.p));
const cradle = new THREE.Matrix4().compose(cradleP.clone().divideScalar(S), phoneQ.clone(), new THREE.Vector3(1, 1, 1));

function handsetAtEar(side) {
  const ear = headPt(EAR[side]), mouth = headPt(MOUTH);
  const hc = pos(B('Head'));
  const xa = ear.clone().sub(mouth).normalize();
  const mid = ear.clone().lerp(mouth, 0.5);
  const out = mid.clone().sub(hc); out.addScaledVector(xa, -out.dot(xa)).normalize();
  const hb = B(side + 'Hand'), palm = pos(hb).lerp(pos(B(side + 'HandMiddle1')), 0.6);
  const c = mid.clone().addScaledVector(out, 0.03).addScaledVector(xa, 0.012).lerp(palm, 0.4);
  const ya = out.clone(), za = new THREE.Vector3().crossVectors(xa, ya).normalize();
  ya.crossVectors(za, xa).normalize();
  const m = new THREE.Matrix4().makeBasis(xa, ya, za); m.setPosition(c);
  return m;
}
const handM = (side) => new THREE.Matrix4().copy(B(side + 'Hand').matrixWorld);
const OFF_TALK = (() => { base('Sitting_Idle_Loop', 'Idle_TalkingPhone_Loop', 0); return handM(PHONE_HAND).invert().multiply(handsetAtEar(PHONE_HAND)); })();

const POLE = (sg) => new THREE.Vector3(sg * 0.7, -1, -0.35);
const sgOf = (side) => (side === 'Left' ? 1 : -1);
function deskHands(t, dur, sides = ['Left', 'Right']) {
  const ph = (t / dur) * Math.PI * 2;
  for (const s of sides) {
    const sg = sgOf(s);
    const tgt = v3([sg * (0.12 + 0.012 * Math.sin(ph + sg)), DESK.top + 0.035, DESK.front + 0.13 + 0.01 * Math.sin(ph * 2 + sg * 0.7)]);
    ik(s, tgt, POLE(sg));
    aim(B(s + 'Hand'), B(s + 'HandMiddle1'), new THREE.Vector3(-sg * 0.55, -0.12, 1));
  }
}
function blink(t, at) { let w = 0; for (const a of at) { const d = Math.abs(t - a); if (d < 0.09) w = Math.max(w, 1 - d / 0.09); } return w; }

const handsetRest = new THREE.Matrix4().copy(cradle);
const clips = [];
function record(name, dur, loop, frameFn) {
  const n = Math.max(2, Math.round(dur * FPS) + (loop ? 0 : 1));
  const q = {}, hp = [], hs = { p: [], q: [] }, mw = [], times = [];
  for (const nm of NAMES) q[nm] = [];
  const M = new THREE.Matrix4(), P = new THREE.Vector3(), R = new THREE.Quaternion(), Sc = new THREE.Vector3();
  for (let f = 0; f < n; f++) {
    const t = loop ? (f / n) * dur : Math.min(dur, f / FPS);
    times.push(+t.toFixed(5));
    const r = frameFn(t);
    for (const nm of NAMES) { const b = B(nm).quaternion; q[nm].push(b.x, b.y, b.z, b.w); }
    const h = B('Hips').position; hp.push(h.x, h.y, h.z);
    M.copy(r.handset || handsetRest).decompose(P, R, Sc);
    hs.p.push(P.x * S, P.y * S, P.z * S); hs.q.push(R.x, R.y, R.z, R.w);
    mw.push(...(r.morph || [0, 0, 0, 0]));
  }
  if (loop) { times.push(+dur.toFixed(5)); for (const nm of NAMES) q[nm].push(...q[nm].slice(0, 4)); hp.push(...hp.slice(0, 3)); hs.p.push(...hs.p.slice(0, 3)); hs.q.push(...hs.q.slice(0, 4)); mw.push(...mw.slice(0, 4)); }
  for (const nm of NAMES) { const a = q[nm]; for (let i = 4; i < a.length; i += 4) if (a[i] * a[i - 4] + a[i + 1] * a[i - 3] + a[i + 2] * a[i - 2] + a[i + 3] * a[i - 1] < 0) for (let k = 0; k < 4; k++) a[i + k] = -a[i + k]; }
  const r5 = (a) => a.map((v) => +v.toFixed(5));
  const out = { name, dur: +dur.toFixed(4), loop, times, hips: r5(hp), handset: { p: r5(hs.p), q: r5(hs.q) }, morph: r5(mw), bones: {} };
  for (const nm of NAMES) {
    const a = q[nm]; let still = true;
    for (let i = 4; i < a.length && still; i++) if (Math.abs(a[i] - a[i % 4]) > 2e-4) still = false;
    out.bones[nm] = still ? r5(a.slice(0, 4)) : r5(a);
  }
  clips.push(out);
}

const loopDur = (src, want) => { const d = anim.clips.get(src).dur; return d * Math.max(1, Math.round(want / d)); };

const IDLE_D = loopDur('Sitting_Idle_Loop', 7.5);
function deskIdle(t, dur = IDLE_D) {
  base('Sitting_Idle_Loop', 'Sitting_Idle_Loop', t);
  const ph = (t / dur) * Math.PI * 2;
  twist(0.04 * Math.sin(ph), 0.05);
  deskHands(t, dur);
  look(-0.05 + 0.05 * Math.sin(ph * 2 + 0.4), 0.28 * Math.sin(ph) + 0.12 * Math.sin(ph * 3 + 1.1));
}
record('desk_idle', IDLE_D, true, (t) => { deskIdle(t); return { morph: [blink(t, [0.8, 3.4, 5.9].map((x) => x * IDLE_D / 7.5)), 0.12 + 0.1 * Math.sin((t / IDLE_D) * Math.PI * 2), 0, 0] }; });

const TYPE_D = loopDur('Sitting_Idle_Loop', 4.5);
record('type', TYPE_D, true, (t) => {
  base('Sitting_Idle_Loop', 'Sitting_Idle_Loop', t);
  const ph = (t / TYPE_D) * Math.PI * 2;
  twist(0, 0.09);
  for (const s of ['Left', 'Right']) {
    const sg = sgOf(s);
    const k = s === 'Left' ? 0 : 1.7;
    const tap = Math.max(0, Math.sin(ph * 23 + k)) * 0.007 + Math.max(0, Math.sin(ph * 31 + k * 2.3)) * 0.005;
    const tgt = v3([DESK.kb[0] + sg * (0.085 + 0.02 * Math.sin(ph * 5 + k)), DESK.kb[1] + 0.03 + tap, DESK.kb[2] - 0.03 + 0.012 * Math.sin(ph * 7 + k)]);
    ik(s, tgt, POLE(sg));
    aim(B(s + 'Hand'), B(s + 'HandMiddle1'), new THREE.Vector3(-sg * 0.3, -0.45, 1));
  }
  twist(0.10, 0);
  look(-0.06 + 0.03 * Math.sin(ph * 3), 0.36 + 0.05 * Math.sin(ph * 2));
  return { morph: [blink(t, [1.1, 3.0].map((x) => x * TYPE_D / 4.5)), 0, 0, 0] };
});

const TALK_D = loopDur('Idle_TalkingPhone_Loop', 5);
function talkPose(t) {
  base('Sitting_Idle_Loop', 'Idle_TalkingPhone_Loop', t);
  deskHands(t, TALK_D, [FREE]);
}
record('phone_talk', TALK_D, true, (t) => {
  talkPose(t);
  const ph = (t / TALK_D) * Math.PI * 2;
  const env = 0.55 + 0.45 * Math.sin(ph * 3 + 0.5);
  jaw(0.11 * (0.5 + 0.5 * Math.sin(ph * 37)) * env + 0.02);
  const hs = handM(PHONE_HAND).multiply(OFF_TALK);
  return { handset: hs, morph: [blink(t, [1.4, 3.9].map((x) => x * TALK_D / 5)), 0.25 + 0.25 * Math.sin(ph * 2), 0.3 * Math.max(0, Math.sin(ph * 2 + 2)), 0.2 * env * Math.max(0, Math.sin(ph * 29))] };
});

const ANS_D = 2.1, GRAB = 0.62, LIFT = 1.4;
let grabPose = null, offGrab = null;
record('phone_answer', ANS_D, false, (t) => {
  let hs = null;
  if (t <= GRAB) {
    deskIdle(t);
    const w = ease(t / GRAB);
    const start = pos(B(PHONE_HAND + 'Hand'));
    const grip = cradleP.clone().divideScalar(S).add(new THREE.Vector3(0, 0.03, 0));
    const tgt = start.lerp(grip, w);
    twist(sgP * 0.14 * w, 0.06 * w);
    ik(PHONE_HAND, tgt, POLE(sgP));
    aim(B(PHONE_HAND + 'Hand'), B(PHONE_HAND + 'HandMiddle1'), new THREE.Vector3(-sgP * 0.6, -0.6, 0.6).lerp(new THREE.Vector3(-sgP * 0.55, -0.12, 1), 1 - w));
    look(-0.18 * w, sgP * 0.35 * w);
    grabPose = capture(); offGrab = handM(PHONE_HAND).invert().multiply(cradle);
  } else {
    const w = ease((t - GRAB) / (LIFT - GRAB));
    talkPose(t - GRAB);
    const talk = capture();
    apply(grabPose); blendTo(talk, w);
    deskHands(t, ANS_D, [FREE]);
    if (t > LIFT + 0.15) jaw(0.10 * Math.max(0, Math.sin((t - LIFT - 0.15) * 26)) * Math.min(1, (ANS_D - t) * 4));
    const P0 = new THREE.Vector3(), Q0 = new THREE.Quaternion(), P1 = new THREE.Vector3(), Q1b = new THREE.Quaternion(), Sx = new THREE.Vector3();
    offGrab.decompose(P0, Q0, Sx); OFF_TALK.decompose(P1, Q1b, Sx);
    const off = new THREE.Matrix4().compose(P0.lerp(P1, w), Q0.slerp(Q1b, w), new THREE.Vector3(1, 1, 1));
    hs = handM(PHONE_HAND).multiply(off);
  }
  return { handset: hs, morph: [blink(t, [1.0]), 0.15, 0.2 * ease((t - 1.2) / 0.4), 0] };
});

const CALL_D = 2.6;
record('call_out', CALL_D, false, (t) => {
  deskIdle(t);
  const idle = capture();
  const up = ease(t / 0.45) * (1 - ease((t - 1.85) / 0.7));
  twist(-0.55, -0.08);
  look(0.30, -0.75);
  const mouth = headPt(MOUTH);
  ik('Right', mouth.clone().add(new THREE.Vector3(-0.12, -0.05, 0.13)), new THREE.Vector3(-1, -0.7, -0.1));
  aim(B('RightHand'), B('RightHandMiddle1'), new THREE.Vector3(0.25, 0.9, 0.35));
  const shout = 1 - ease((t - 1.55) / 0.3);
  jaw((0.06 + 0.30 * ease((t - 0.35) / 0.18) * shout) + 0.02 * Math.sin(t * 40) * ease((t - 0.4) / 0.2) * shout);
  const pose = capture();
  apply(idle); blendTo(pose, up);
  return { morph: [blink(t, [2.2]), 0, 0.9 * up, 0.55 * ease((t - 0.35) / 0.2) * shout] };
});

window.__bake = {
  version: 1, fps: FPS, scale: S,
  seat: { height: +seatHeight.toFixed(3), hipsY: +hipsY.toFixed(3), knee: +((kneeY - contact) * S).toFixed(3) },
  desk: { top: DESK.top, front: DESK.front, keyboard: DESK.kb, monitor: DESK.mon, monitorYaw: DESK.monYaw },
  phone: { pos: PHONE.p, yaw: +PHONE.yaw.toFixed(4), hand: PHONE_HAND },
  handsetLocal: [HS_LOCAL.x, HS_LOCAL.y, HS_LOCAL.z],
  morphs: ['blink', 'smile', 'browUp', 'funnel'],
  bones: NAMES, clips,
};
</script>
</body>
</html>
